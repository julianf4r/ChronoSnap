name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build --bundles msi

      - name: Package Windows executable
        shell: pwsh
        run: |
          $exePath = "src-tauri/target/release/ChronoSnap.exe"
          $archiveDir = "src-tauri/target/release/artifacts"
          $archiveName = "ChronoSnap-${{ github.ref_name }}-windows-x64.7z"
          $archivePath = Join-Path $archiveDir $archiveName

          New-Item -ItemType Directory -Path $archiveDir -Force | Out-Null

          # Run 7z from the exe directory so the archive only contains ChronoSnap.exe.
          Push-Location (Split-Path $exePath)
          try {
            7z a -t7z (Join-Path (Resolve-Path ..\release\artifacts) $archiveName) (Split-Path $exePath -Leaf)
          }
          finally {
            Pop-Location
          }
    
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/release/artifacts/*.7z
            src-tauri/target/release/bundle/**/*.msi

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/artifacts/*.7z
            src-tauri/target/release/bundle/**/*.msi

  build-macos:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS app for Apple Silicon and Intel
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Verify macOS app signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ChronoSnap.app
          codesign --display --verbose=2 \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ChronoSnap.app

      - name: Package macOS app
        run: |
          mkdir -p src-tauri/target/universal-apple-darwin/release/artifacts
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/universal-apple-darwin/release/bundle/macos/ChronoSnap.app \
            "src-tauri/target/universal-apple-darwin/release/artifacts/ChronoSnap-${{ github.ref_name }}-macos-universal.app.zip"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            src-tauri/target/universal-apple-darwin/release/artifacts/*.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/universal-apple-darwin/release/artifacts/*.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
